<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Trader — Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #e3e6ea;
    --text: #1a1d21; --muted: #6b7280; --accent: #3b5bdb; --accent-soft: #e7ecff;
    --pos: #2f9e44; --neg: #e03131; --warn: #f08c00; --grid: #eceef1;
    --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116; --panel: #161b22; --panel-2: #1c222b; --border: #2a313c;
      --text: #e6edf3; --muted: #8b949e; --accent: #6b8afd; --accent-soft: #1d2740;
      --pos: #4ade80; --neg: #f87171; --warn: #fbbf24; --grid: #232a34;
      --chip: #222833;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c222b; --border: #2a313c;
    --text: #e6edf3; --muted: #8b949e; --accent: #6b8afd; --accent-soft: #1d2740;
    --pos: #4ade80; --neg: #f87171; --warn: #fbbf24; --grid: #232a34;
    --chip: #222833;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
    "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .badge { font-size: 11px; color: var(--muted); }
  .grow { flex: 1; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; padding-block: 20px; }
  button, select { font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }

  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 12px; font-weight: 650; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button { border-radius: 999px; background: transparent; border: 1px solid transparent;
    color: var(--muted); }
  .tabs button.active { background: var(--accent-soft); color: var(--accent);
    border-color: transparent; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border);
    white-space: nowrap; font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; position: sticky; top: 0; background: var(--panel); }
  th:first-child, td:first-child { text-align: left; }
  td.l, th.l { text-align: left; }
  .tablescroll { overflow-x: auto; }
  tbody tr:hover { background: var(--panel-2); }

  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; background: var(--chip); color: var(--muted); }
  .chip.FILLED, .chip.WON, .chip.RUNNING, .chip.YES { background: rgba(47,158,68,.15); color: var(--pos); }
  .chip.CANCELLED, .chip.LOST, .chip.NO, .chip.FAILED { background: rgba(224,49,49,.15); color: var(--neg); }
  .chip.PARTIALLY_FILLED, .chip.LIVE, .chip.EXITED, .chip.NO_NEW_POSITIONS, .chip.READ_ONLY { background: rgba(240,140,0,.15); color: var(--warn); }
  .chip.UNKNOWN, .chip.HARD_HALT { background: rgba(224,49,49,.2); color: var(--neg); }

  .pred { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    margin-bottom: 12px; background: var(--panel); }
  .pred .q { font-weight: 600; margin-bottom: 8px; }
  .pred .row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 13px; }
  .pred .metric { color: var(--muted); }
  .pred .metric b { color: var(--text); font-variant-numeric: tabular-nums; }
  .pred ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; }
  .kv .item { display: flex; justify-content: space-between; gap: 12px;
    border-bottom: 1px dotted var(--border); padding: 5px 0; font-size: 13px; }
  .kv .item .k { color: var(--muted); }
  .kv .item .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  svg text { fill: var(--muted); }
  .err { color: var(--neg); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>📊 Polymarket Trader</h1>
  <span class="badge" id="mode-badge"></span>
  <span class="grow"></span>
  <label class="switch"><input type="checkbox" id="auto"> <span id="auto-label"></span></label>
  <button id="refresh"></button>
  <select id="lang" title="Language / 语言">
    <option value="en">EN</option><option value="zh">中文</option>
  </select>
  <select id="theme" title="Theme / 主题">
    <option value="auto"></option><option value="light"></option><option value="dark"></option>
  </select>
</header>

<div class="wrap">
  <div id="error" class="err" hidden></div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2 id="eq-title"></h2>
    <div id="chart"></div>
    <div class="note" id="eq-note"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
"use strict";

/* ----------------------------- i18n ---------------------------------- */
const I18N = {
  en: {
    mode_ro: m => `${String(m).toUpperCase()} · read-only`,
    auto_refresh: "auto-refresh", refresh: "Refresh",
    theme_auto: "Auto", theme_light: "Light", theme_dark: "Dark",
    eq_title: "Equity curve",
    eq_note: "Daily mark-to-market equity. A 7-day result is a systems test, not proof of long-term edge.",
    chart_empty: "No daily snapshots yet.",
    tab_overview: "Overview", tab_trades: "Trades", tab_predictions: "AI Predictions",
    tab_orders: "Orders", tab_events: "Event Log", tab_strategy: "Strategy & Limits",
    kpi_equity: "Equity", kpi_netpnl: "Net PnL", kpi_drawdown: "Max Drawdown",
    kpi_winrate: "Win Rate", kpi_brier: "Brier Score", kpi_riskstate: "Risk State",
    kpi_fees: "Fees + Slippage", kpi_realized: "Realized / Unreal.",
    sub_start: x => `start ${x}`, sub_peak: "peak-to-trough",
    sub_wl: (w,l,n) => `${w}W / ${l}L · ${n} trades`,
    sub_brier: n => `${n} scored · 0.25=coin-flip`,
    sub_days: n => `${n} days`, sub_fees: x => `fees ${x}`, sub_unreal: x => `unreal. ${x}`,
    ov_integrity: "Risk & engineering integrity", ov_calibration: "AI probability calibration",
    ov_calib_note: "Buckets predicted probability vs. how often those outcomes actually occurred.",
    eng_selection: "Selection rejections", eng_edge: "Edge rejections", eng_risk: "Risk rejections",
    eng_dupe: "Duplicate orders suppressed", eng_unknown: "UNKNOWN order states",
    eng_settlements: "Settlements", eng_maker: "Maker ratio", eng_anomalous: "Anomalous trades",
    eng_reconciled: "Ledger reconciled", val_consistent: "consistent", val_mismatch: "MISMATCH",
    calib_cell: (p,a,n) => `pred ${p} · actual ${a} (n=${n})`,
    calib_empty: "No settled predictions to score yet.",
    bd_topic: "Performance by market topic", bd_confidence: "Performance by AI confidence",
    bd_evidence: "Performance: evidence vs. none",
    col_group: "Group", col_trades: "Trades", col_settled: "Settled", col_winrate: "Win rate",
    col_netpnl: "Net PnL", col_avgpnl: "Avg PnL",
    empty_records: "No records yet.", empty_bd: "No trades yet.",
    empty_preds: "No AI predictions recorded yet.",
    t_market: "Market", t_out: "Out", t_side: "Side", t_aip: "AI p", t_price: "Price",
    t_size: "Size", t_filled: "Filled", t_fee: "Fee", t_slip: "Slip", t_result: "Result", t_pnl: "PnL",
    o_order: "Order", o_type: "Type", o_limit: "Limit", o_avg: "Avg", o_status: "Status", o_maker: "Maker",
    e_kind: "Kind", e_detail: "Detail",
    p_aiprob: "AI prob", p_market: "Market", p_edge: "Edge", p_conf: "Confidence",
    p_horizon: "Horizon", p_action: "Action", p_evidence: "Evidence",
    p_invalidating: "Invalidating conditions",
    strat_account: "Account", strat_strategy: "Strategy", strat_costs: "Costs",
    strat_selection: "Selection", strat_sizing: "Position sizing",
    strat_breakers: "Circuit breakers", strat_execution: "Execution",
    strat_note: "These parameters are loaded from an immutable config file. The AI engine cannot read or modify them.",
    err_load: m => `Could not load ledger: ${m} — run a simulation first (see README).`,
  },
  zh: {
    mode_ro: m => `${m==='simulation'?'模拟':m==='live'?'实盘':m} · 只读`,
    auto_refresh: "自动刷新", refresh: "刷新",
    theme_auto: "自动", theme_light: "浅色", theme_dark: "深色",
    eq_title: "资金曲线",
    eq_note: "每日按市值计算的权益。七天结果仅为系统测试，不能证明长期收益能力。",
    chart_empty: "暂无每日快照。",
    tab_overview: "概览", tab_trades: "成交", tab_predictions: "AI 预测",
    tab_orders: "订单", tab_events: "事件日志", tab_strategy: "策略与限额",
    kpi_equity: "权益", kpi_netpnl: "净盈亏", kpi_drawdown: "最大回撤",
    kpi_winrate: "胜率", kpi_brier: "Brier 分数", kpi_riskstate: "风控状态",
    kpi_fees: "手续费 + 滑点", kpi_realized: "已实现 / 未实现",
    sub_start: x => `初始 ${x}`, sub_peak: "峰值到谷值",
    sub_wl: (w,l,n) => `${w}胜 / ${l}负 · ${n} 笔`,
    sub_brier: n => `${n} 项评分 · 0.25=随机`,
    sub_days: n => `${n} 天`, sub_fees: x => `手续费 ${x}`, sub_unreal: x => `未实现 ${x}`,
    ov_integrity: "风控与工程完整性", ov_calibration: "AI 概率校准",
    ov_calib_note: "将预测概率分桶，与这些结果的实际发生频率进行对比。",
    eng_selection: "筛选拒绝", eng_edge: "优势不足拒绝", eng_risk: "风控拒绝",
    eng_dupe: "重复订单拦截", eng_unknown: "UNKNOWN 订单状态",
    eng_settlements: "结算次数", eng_maker: "Maker 比例", eng_anomalous: "异常成交",
    eng_reconciled: "账本对账", val_consistent: "一致", val_mismatch: "不一致",
    calib_cell: (p,a,n) => `预测 ${p} · 实际 ${a}（n=${n}）`,
    calib_empty: "暂无已结算的预测可评分。",
    bd_topic: "按市场主题的表现", bd_confidence: "按 AI 置信度的表现",
    bd_evidence: "有证据 vs 无证据",
    col_group: "分组", col_trades: "笔数", col_settled: "已结算", col_winrate: "胜率",
    col_netpnl: "净盈亏", col_avgpnl: "平均盈亏",
    empty_records: "暂无记录。", empty_bd: "暂无成交。",
    empty_preds: "暂无 AI 预测记录。",
    t_market: "市场", t_out: "选项", t_side: "买卖", t_aip: "AI 概率", t_price: "价格",
    t_size: "金额", t_filled: "成交", t_fee: "费用", t_slip: "滑点", t_result: "结算", t_pnl: "盈亏",
    o_order: "订单", o_type: "类型", o_limit: "限价", o_avg: "均价", o_status: "状态", o_maker: "Maker",
    e_kind: "类型", e_detail: "详情",
    p_aiprob: "AI 概率", p_market: "市场价", p_edge: "优势", p_conf: "置信度",
    p_horizon: "周期", p_action: "建议", p_evidence: "证据",
    p_invalidating: "失效条件",
    strat_account: "账户", strat_strategy: "策略", strat_costs: "成本",
    strat_selection: "市场筛选", strat_sizing: "仓位规模",
    strat_breakers: "熔断规则", strat_execution: "执行",
    strat_note: "这些参数从不可变的配置文件加载，AI 引擎无法读取或修改。",
    err_load: m => `无法加载账本：${m} — 请先运行一次模拟（见 README）。`,
  },
};
let lang = "en";
const _qlang = new URLSearchParams(location.search).get("lang");
if (_qlang === "zh" || _qlang === "en") {
  lang = _qlang;
} else {
  try {
    lang = localStorage.getItem("pt-lang")
      || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
  } catch(e) {}
}
function t(key, ...args){
  const v = (I18N[lang] || I18N.en)[key];
  return (typeof v === "function") ? v(...args) : (v == null ? key : v);
}

/* --------------------------- helpers --------------------------------- */
const $ = (s, r=document) => r.querySelector(s);
const fmtMoney = v => (v==null ? "—" : "$" + Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
const fmtPct = v => (v==null ? "—" : (Number(v)*100).toFixed(2) + "%");
const fmtNum = (v,d=2) => (v==null ? "—" : Number(v).toFixed(d));
const cls = v => (v==null||v===0) ? "" : (v>0 ? "pos" : "neg");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = (v) => `<span class="chip ${esc(v)}">${esc(v)}</span>`;

const TAB_IDS = ["overview","trades","predictions","orders","events","strategy"];
const TAB_KEY = {overview:"tab_overview",trades:"tab_trades",predictions:"tab_predictions",
  orders:"tab_orders",events:"tab_events",strategy:"tab_strategy"};
const initialTab = TAB_IDS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
const state = { tab: initialTab, data: {}, mode: "simulation" };

/* --------------------------- data load ------------------------------- */
async function getJSON(path){
  const r = await fetch(path, {cache:"no-store"});
  if(!r.ok){ const j = await r.json().catch(()=>({error:r.statusText})); throw new Error(j.error||("HTTP "+r.status)); }
  return r.json();
}
async function loadAll(){
  $("#error").hidden = true;
  try {
    const [summary, daily, trades, preds, orders, events, config, recon] = await Promise.all([
      getJSON("/api/summary"), getJSON("/api/daily"), getJSON("/api/trades"),
      getJSON("/api/predictions"), getJSON("/api/orders"), getJSON("/api/events"),
      getJSON("/api/config"), getJSON("/api/reconciliations"),
    ]);
    state.data = {summary, daily, trades, preds, orders, events, config, recon};
    state.mode = (config.execution && config.execution.mode) || "simulation";
    renderChrome(); renderCards(); renderChart(); render();
  } catch(e){
    const el = $("#error"); el.hidden = false;
    el.textContent = t("err_load", e.message);
  }
}

/* ----------------------- static chrome (i18n) ------------------------ */
function renderChrome(){
  document.documentElement.lang = (lang === "zh") ? "zh-CN" : "en";
  $("#mode-badge").textContent = t("mode_ro", state.mode);
  $("#auto-label").textContent = t("auto_refresh");
  $("#refresh").textContent = t("refresh");
  $("#eq-title").textContent = t("eq_title");
  $("#eq-note").textContent = t("eq_note");
  const th = $("#theme").options;
  th[0].textContent = t("theme_auto"); th[1].textContent = t("theme_light"); th[2].textContent = t("theme_dark");
}

/* ------------------------------ views -------------------------------- */
function renderCards(){
  const s = state.data.summary; if(!s) return;
  const p = s.profit, tr = s.trading, ai = s.ai, r = s.risk;
  const cards = [
    [t("kpi_equity"), fmtMoney(p.end_equity), t("sub_start", fmtMoney(p.start_equity)), ""],
    [t("kpi_netpnl"), fmtMoney(p.net_pnl), fmtPct(p.return_pct), cls(p.net_pnl)],
    [t("kpi_drawdown"), fmtPct(p.max_drawdown_pct), t("sub_peak"), "warn"],
    [t("kpi_winrate"), tr.win_rate==null?"—":fmtPct(tr.win_rate), t("sub_wl", tr.wins, tr.losses, tr.total_trades), ""],
    [t("kpi_brier"), ai.brier_score==null?"—":fmtNum(ai.brier_score,4), t("sub_brier", ai.scored_predictions), ""],
    [t("kpi_riskstate"), `<span style="font-size:16px">${chip(r.halt_level)}</span>`, t("sub_days", r.days_recorded), ""],
    [t("kpi_fees"), fmtMoney((p.total_fees||0)+(p.slippage_cost||0)), t("sub_fees", fmtMoney(p.total_fees)), ""],
    [t("kpi_realized"), fmtMoney(p.realized_pnl), t("sub_unreal", fmtMoney(p.unrealized_pnl)), cls(p.realized_pnl)],
  ];
  $("#cards").innerHTML = cards.map(([l,v,sub,c]) =>
    `<div class="card"><div class="label">${l}</div><div class="value ${c}">${v}</div><div class="sub">${sub}</div></div>`).join("");
}

function renderChart(){
  const d = state.data.daily || [];
  const host = $("#chart");
  if(d.length < 1){ host.innerHTML = `<div class="empty">${t("chart_empty")}</div>`; return; }
  const W=1120, H=240, pad={l:56,r:16,t:14,b:26};
  const xs = d.map(r=>r.day), ys = d.map(r=>r.equity);
  const start = state.data.summary ? state.data.summary.profit.start_equity : ys[0];
  const allY = ys.concat([start]);
  let ymin = Math.min(...allY), ymax = Math.max(...allY);
  const padY = (ymax-ymin)*0.15 || Math.max(1, ymax*0.01); ymin-=padY; ymax+=padY;
  const xmin = Math.min(...xs), xmax = Math.max(...xs, xmin+1);
  const px = x => pad.l + (x-xmin)/(xmax-xmin || 1)*(W-pad.l-pad.r);
  const py = y => pad.t + (1-(y-ymin)/(ymax-ymin || 1))*(H-pad.t-pad.b);
  const pts = d.map(r=>`${px(r.day).toFixed(1)},${py(r.equity).toFixed(1)}`).join(" ");
  const up = ys[ys.length-1] >= start;
  const color = up ? "var(--pos)" : "var(--neg)";
  const dayLabel = (lang === "zh") ? "第" : "D";
  let grid = "", ticks = 4;
  for(let i=0;i<=ticks;i++){ const y = ymin + (ymax-ymin)*i/ticks; const yy=py(y);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="var(--grid)"/>`;
    grid += `<text x="${pad.l-8}" y="${yy+4}" text-anchor="end" font-size="11">${fmtMoney(y)}</text>`; }
  const b = py(start);
  const baseline = `<line x1="${pad.l}" y1="${b}" x2="${W-pad.r}" y2="${b}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".6"/>`;
  const area = `${px(xmin)},${py(ymin)} ${pts} ${px(xmax)},${py(ymin)}`;
  const dtxt = d.map(r => (lang === "zh") ? `${dayLabel}${r.day}` : `D${r.day}`);
  let xlabels = d.map((r,i)=>`<text x="${px(r.day)}" y="${H-8}" text-anchor="middle" font-size="11">${dtxt[i]}</text>`).join("");
  const dots = d.map(r=>`<circle cx="${px(r.day)}" cy="${py(r.equity)}" r="3" fill="${color}"/>`).join("");
  host.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${t("eq_title")}">
      ${grid}${baseline}
      <polygon points="${area}" fill="${color}" opacity="0.08"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${xlabels}
    </svg>`;
}

function renderTabs(){
  $("#tabs").innerHTML = TAB_IDS.map(id =>
    `<button data-tab="${id}" class="${state.tab===id?'active':''}">${t(TAB_KEY[id])}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.tab = b.dataset.tab; location.hash = b.dataset.tab; renderTabs(); render(); });
}

function render(){
  renderTabs();
  const v = $("#view"), d = state.data;
  if(state.tab==="overview") return void (v.innerHTML = viewOverview(d));
  if(state.tab==="trades") return void (v.innerHTML = viewTrades(d.trades));
  if(state.tab==="predictions") return void (v.innerHTML = viewPredictions(d.preds));
  if(state.tab==="orders") return void (v.innerHTML = viewOrders(d.orders));
  if(state.tab==="events") return void (v.innerHTML = viewEvents(d.events));
  if(state.tab==="strategy") return void (v.innerHTML = viewStrategy(d.config));
}

function tableOf(cols, rows, rowFn){
  if(!rows || !rows.length) return `<div class="empty">${t("empty_records")}</div>`;
  return `<div class="panel tablescroll"><table><thead><tr>${
    cols.map(c=>`<th class="${c.l?'l':''}">${c.t}</th>`).join("")
  }</tr></thead><tbody>${rows.map(rowFn).join("")}</tbody></table></div>`;
}

function viewOverview(d){
  const s = d.summary; if(!s) return "";
  const eng = s.engineering, ai = s.ai, tr = s.trading;
  const engRows = [
    [t("eng_selection"), eng.selection_rejections],
    [t("eng_edge"), eng.edge_rejections],
    [t("eng_risk"), eng.risk_rejections],
    [t("eng_dupe"), eng.duplicate_suppressed],
    [t("eng_unknown"), eng.unknown_orders],
    [t("eng_settlements"), eng.settlements],
    [t("eng_maker"), tr.maker_ratio==null?"—":fmtPct(tr.maker_ratio)],
    [t("eng_anomalous"), tr.anomalous_trades],
  ];
  const calib = (ai.calibration||[]).filter(b=>b.count>0);
  const calibRows = calib.length
    ? calib.map(b=>`<div class="item"><span class="k">${b.range}</span><span class="v">${t("calib_cell", fmtNum(b.avg_pred,2), fmtNum(b.actual_freq,2), b.count)}</span></div>`).join("")
    : `<div class="empty">${t("calib_empty")}</div>`;
  const reconOK = (d.recon||[]).every(r=>r.consistent);
  return `
    <div class="panel"><h2>${t("ov_integrity")}</h2>
      <div class="kv">${engRows.map(([k,val])=>`<div class="item"><span class="k">${k}</span><span class="v">${val}</span></div>`).join("")}
        <div class="item"><span class="k">${t("eng_reconciled")}</span><span class="v ${reconOK?'pos':'neg'}">${reconOK?t("val_consistent"):t("val_mismatch")}</span></div>
      </div>
    </div>
    <div class="panel"><h2>${t("ov_calibration")}</h2><div class="kv">${calibRows}</div>
      <div class="note">${t("ov_calib_note")}</div>
    </div>
    ${viewBreakdowns(s.breakdowns)}`;
}

function breakdownTable(title, rows){
  if(!rows || !rows.length) return `<div class="panel"><h2>${title}</h2><div class="empty">${t("empty_bd")}</div></div>`;
  const body = rows.map(r => `<tr>
    <td class="l">${esc(r.key)}</td><td>${r.count}</td><td>${r.settled}</td>
    <td>${r.win_rate==null?"—":fmtPct(r.win_rate)}</td>
    <td class="${cls(r.net_pnl)}">${r.net_pnl?fmtMoney(r.net_pnl):"—"}</td>
    <td class="${cls(r.avg_pnl)}">${r.avg_pnl==null?"—":fmtMoney(r.avg_pnl)}</td></tr>`).join("");
  return `<div class="panel tablescroll"><h2>${title}</h2><table>
    <thead><tr><th class="l">${t("col_group")}</th><th>${t("col_trades")}</th><th>${t("col_settled")}</th><th>${t("col_winrate")}</th><th>${t("col_netpnl")}</th><th>${t("col_avgpnl")}</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

function viewBreakdowns(b){
  if(!b) return "";
  return breakdownTable(t("bd_topic"), b.by_topic)
    + breakdownTable(t("bd_confidence"), b.by_confidence)
    + breakdownTable(t("bd_evidence"), b.by_evidence);
}

function viewTrades(rows){
  const cols = [{t:t("t_market"),l:1},{t:t("t_out")},{t:t("t_side")},{t:t("t_aip")},{t:t("t_price")},
    {t:t("t_size")},{t:t("t_filled")},{t:t("t_fee")},{t:t("t_slip")},{t:t("t_result")},{t:t("t_pnl")},{t:"⚠"}];
  return tableOf(cols, rows, r => `<tr>
    <td class="l" title="${esc(r.question)}">${esc((r.question||r.market_id||"").slice(0,42))}</td>
    <td>${chip(r.outcome)}</td><td>${esc(r.side)}</td>
    <td>${fmtNum(r.ai_probability,2)}</td><td>${fmtNum(r.fill_price,3)}</td>
    <td>${fmtMoney(r.size)}</td><td>${fmtMoney(r.filled_size)}</td>
    <td>${fmtNum(r.fee,3)}</td><td>${fmtNum(r.slippage,3)}</td>
    <td>${r.outcome_result?chip(r.outcome_result):"—"}</td>
    <td class="${cls(r.pnl)}">${r.pnl?fmtMoney(r.pnl):"—"}</td>
    <td>${r.anomalous?'⚠':''}</td></tr>`);
}

function viewPredictions(rows){
  if(!rows || !rows.length) return `<div class="empty">${t("empty_preds")}</div>`;
  return rows.slice().reverse().map(r => {
    let payload = {}; try { payload = JSON.parse(r.payload||"{}"); } catch(e){}
    const ev = payload.evidence || [];
    const inv = payload.invalidating_conditions || [];
    return `<div class="pred">
      <div class="q">${esc(r.question)} ${chip(r.selected_outcome)}</div>
      <div class="row">
        <span class="metric">${t("p_aiprob")} <b>${fmtNum(r.estimated_probability,2)}</b></span>
        <span class="metric">${t("p_market")} <b>${fmtNum(r.market_price,2)}</b></span>
        <span class="metric">${t("p_edge")} <b class="${cls(r.estimated_edge)}">${fmtNum(r.estimated_edge,3)}</b></span>
        <span class="metric">${t("p_conf")} <b>${fmtNum(r.confidence,2)}</b></span>
        <span class="metric">${t("p_horizon")} <b>${esc(payload.time_horizon||"—")}</b></span>
        <span class="metric">${t("p_action")} <b>${esc(payload.recommended_action||"—")}</b> @ <b>${fmtNum(payload.recommended_price,2)}</b></span>
      </div>
      <div class="row" style="gap:32px">
        <div><div class="metric">${t("p_evidence")}</div><ul>${ev.map(e=>`<li>${esc(e)}</li>`).join("")||"<li>—</li>"}</ul></div>
        <div><div class="metric">${t("p_invalidating")}</div><ul>${inv.map(e=>`<li>${esc(e)}</li>`).join("")||"<li>—</li>"}</ul></div>
      </div>
    </div>`;
  }).join("");
}

function viewOrders(rows){
  const cols = [{t:t("o_order"),l:1},{t:t("t_market"),l:1},{t:t("t_out")},{t:t("o_type")},{t:t("o_limit")},
    {t:t("t_size")},{t:t("t_filled")},{t:t("o_avg")},{t:t("t_fee")},{t:t("o_status")},{t:t("o_maker")}];
  return tableOf(cols, rows, r => `<tr>
    <td class="l">${esc((r.order_id||"").slice(0,12))}</td>
    <td class="l">${esc((r.market_id||"").slice(0,20))}</td>
    <td>${chip(r.outcome)}</td><td>${esc(r.order_type)}</td>
    <td>${fmtNum(r.limit_price,3)}</td><td>${fmtMoney(r.size)}</td>
    <td>${fmtMoney(r.filled_size)}</td><td>${fmtNum(r.avg_fill_price,3)}</td>
    <td>${fmtNum(r.fee_paid,3)}</td><td>${chip(r.status)}</td>
    <td>${r.is_maker?'✓':''}</td></tr>`);
}

function viewEvents(rows){
  const cols = [{t:t("e_kind"),l:1},{t:t("t_market"),l:1},{t:t("e_detail"),l:1}];
  return tableOf(cols, rows, r => `<tr>
    <td class="l">${chip(r.kind)}</td>
    <td class="l">${esc(r.market_id||"—")}</td>
    <td class="l">${esc(r.detail)}</td></tr>`);
}

function viewStrategy(cfg){
  if(!cfg) return "";
  const groups = [
    [t("strat_account"), cfg.account], [t("strat_strategy"), cfg.strategy], [t("strat_costs"), cfg.costs],
    [t("strat_selection"), cfg.selection], [t("strat_sizing"), cfg.sizing],
    [t("strat_breakers"), cfg.circuit_breakers], [t("strat_execution"), cfg.execution],
  ];
  return groups.map(([title, obj]) => `<div class="panel"><h2>${title}</h2><div class="kv">${
    Object.entries(obj||{}).map(([k,v])=>`<div class="item"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")
  }</div></div>`).join("") +
  `<div class="note">${t("strat_note")}</div>`;
}

/* --------------------------- controls -------------------------------- */
const themeSel = $("#theme");
try { themeSel.value = localStorage.getItem("pt-theme") || "auto"; } catch(e) {}
function applyTheme(){ const th = themeSel.value;
  if(th==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", th);
  try { localStorage.setItem("pt-theme", th); } catch(e) {}
  renderChart(); }
themeSel.onchange = applyTheme; applyTheme();

const langSel = $("#lang");
langSel.value = lang;
langSel.onchange = () => {
  lang = langSel.value;
  try { localStorage.setItem("pt-lang", lang); } catch(e) {}
  renderChrome(); renderCards(); renderChart(); render();
};

$("#refresh").onclick = loadAll;
let timer = null;
$("#auto").onchange = e => { clearInterval(timer); if(e.target.checked) timer = setInterval(loadAll, 5000); };
window.addEventListener("resize", () => renderChart());

renderChrome();
loadAll();
</script>
</body>
</html>
